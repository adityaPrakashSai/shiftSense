[project]
name = "shiftsense"
version = "0.0.0"
description = "Nurse roster assistant: Meta Muse Spark models for language, OR-Tools CP-SAT for every roster decision"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ortools==9.15.6755",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    # Used only as the HTTP client for OpenAI-compatible endpoints serving Meta models
    # (Baseten: meta-models/muse-spark-open-1026). No OpenAI model is ever called.
    "openai>=1.40,<2",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reference", "web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["app", "evals"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.solver", "app.solver.*"]
strict = true

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
